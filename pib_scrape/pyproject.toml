[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pib-scrape"
version = "0.1.0"
description = "Scrape PIB daily press releases into a local Chroma vector DB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0,<3",
  "beautifulsoup4>=4.12.0,<5",
  "lxml>=5.0.0,<6",
  "python-dotenv>=1.0.0,<2",
  "chromadb>=0.5.0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9"]

[project.scripts]
pib-scrape = "pib_scrape.cli:main"

[tool.setuptools.packages.find]
include = ["pib_scrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
